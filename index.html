<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappy</title>
  <link rel="stylesheet" href="tailwind.generated.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between">

  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- Top Arcade HUD Bar -->
  <header class="hud-header w-full max-w-7xl mx-auto px-2 pt-2">
    <div class="hud-panel">
      <!-- Round progress and controls -->
      <div class="hud-status-row flex flex-wrap items-center justify-end gap-2 pb-1.5 border-b border-slate-700/80">
        <div class="hud-controls flex flex-wrap items-center gap-1.5 sm:gap-2">
          <!-- Progress Badge -->
          <div class="bg-slate-900 border-2 border-slate-950 px-2 py-0.5 rounded text-[10px] font-bold text-sky-300">
            ROUND <span id="stage-val">1/4</span>
          </div>

          <!-- Restart Game Button -->
          <button id="restart-btn" type="button" class="retro-btn bg-amber-400 text-slate-950 px-2 py-0.5 rounded text-[10px] font-bold">
            START OVER
          </button>
        </div>
        <div class="hud-score bg-slate-900 border-2 border-slate-950 px-2 py-0.5 rounded text-[10px] font-bold text-emerald-400">
          FOUND <span id="score-val">0</span>/4
        </div>
      </div>

      <div class="progress-track" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div class="hud-question pt-1.5 flex items-start gap-2">
        <div class="min-w-0">
          <h1 id="question-text" class="text-xl sm:text-2xl font-bold text-white leading-snug">
            Let's find a state
          </h1>
        </div>
      </div>
    </div>
  </header>

  <!-- Interactive India map -->
  <main class="mobile-map-main flex-1 flex flex-col items-center justify-center w-full max-w-full mx-auto px-0 sm:px-2 py-3 sm:py-4">
    <div class="map-shell w-full relative">
      
      <!-- Responsive SVG Outline Map of India -->
      <svg id="india-map" viewBox="65 38 450 474" class="map-svg w-full h-auto select-none block mx-auto" role="img" aria-label="Interactive map of India. Tap the state named above.">
        <!-- Sea Labels -->
        <text x="104" y="435" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">ARABIAN</text>
        <text x="115" y="450" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">SEA</text>
        <text x="351" y="425" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">BAY OF</text>
        <text x="348" y="440" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">BENGAL</text>

        <!-- State Outlines -->
        <g id="states-layer" transform="matrix(0.82 0 0 1 51.3 0)"></g>

      </svg>

    </div>
  </main>

    <script src="india-boundaries.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
