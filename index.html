<body class="min-h-screen flex flex-col justify-between">

  <div class="crt-overlay" aria-hidden="true"></div>

  <header class="hud-header w-full max-w-7xl mx-auto px-2 pt-2">
    <div class="hud-panel">
      <div class="top-controls">
        <div class="level-tabs" role="group" aria-label="Choose game level">
          <button class="level-tab" type="button" data-level="1" aria-pressed="true">LVL 1</button>
          <button class="level-tab" type="button" data-level="2" aria-pressed="false">LVL 2</button>
          <button class="level-tab" type="button" data-level="3" aria-pressed="false">LVL 3</button>
          <button class="level-tab" type="button" data-level="4" aria-pressed="false">LVL 4</button>
        </div>
        <button id="restart-btn" class="start-over-btn" type="button">START OVER</button>
      </div>
      <div class="hud-question pt-1.5 flex items-start gap-2">
        <h1 id="question-text" class="text-xl sm:text-2xl font-bold text-white leading-snug" style="visibility: hidden" aria-live="polite"></h1>
      </div>
    </div>
  </header>

  <!-- Interactive India map -->
  <main class="mobile-map-main flex-1 flex flex-col items-center justify-center w-full max-w-full mx-auto px-0 sm:px-2 py-3 sm:py-4">
    <div class="map-shell w-full relative">
      <div class="map-zoom-controls" role="group" aria-label="Map zoom controls">
        <button id="zoom-in-btn" class="map-zoom-btn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoom-out-btn" class="map-zoom-btn" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="zoom-reset-btn" class="map-zoom-btn map-zoom-reset" type="button" aria-label="Reset map zoom" title="Reset map zoom">↺</button>
      </div>
      
      <!-- Responsive SVG Outline Map of India -->
      <svg id="india-map" viewBox="65 38 450 474" preserveAspectRatio="xMidYMid meet" class="map-svg w-full h-auto select-none block mx-auto" role="img" aria-label="Interactive map of India. Tap the state named above.">
        <!-- Sea Labels -->
        <text x="104" y="435" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">ARABIAN</text>
        <text x="115" y="450" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">SEA</text>
        <text x="351" y="425" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">BAY OF</text>
        <text x="348" y="440" fill="#9c8964" font-size="11" font-weight="bold" letter-spacing="2">BENGAL</text>

        <!-- State Outlines -->
        <g id="states-layer" transform="matrix(0.82 0 0 1 51.3 0)"></g>

      </svg>

    </div>
  </main>

    <script src="india-boundaries.js" defer></script>
    <script src="script.js" defer></script>
</body>
